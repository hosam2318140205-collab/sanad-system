name: POS app CI

on:
  push:
    paths: ["pos-app/**", ".github/workflows/pos-app-ci.yml"]
  pull_request:
    paths: ["pos-app/**", ".github/workflows/pos-app-ci.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pos-app/package-lock.json
      - run: npm ci
      # Typecheck, lint, migration bundle up to date, production build, no secrets in client bundles
      - run: npm run verify
      - name: Database tests (throwaway Postgres, never Supabase)
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
